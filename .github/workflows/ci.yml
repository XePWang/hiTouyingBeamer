name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-dev.txt

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r scripts/requirements-dev.txt

      - name: Install TeX Live and Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils latexmk texlive-xetex texlive-lang-chinese texlive-science texlive-latex-extra texlive-fonts-recommended lmodern

      - name: Run complete test suite
        shell: bash
        run: |
          mkdir -p .work
          python scripts/test-suite.py 2>&1 | tee .work/ci-tests.txt

      - name: Verify release package
        shell: bash
        run: python scripts/package.py 2>&1 | tee .work/ci-package.txt

      - name: Report failure details
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in Path('.work').glob('ci-*.txt'):
              tail = '\n'.join(path.read_text(errors='replace').splitlines()[-50:])
              escaped = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title={path.name}::{escaped}')
          PY

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hiTouyingBeamer-failure-logs
          include-hidden-files: true
          path: |
            .work/**/*.txt
            .work/**/*.log

      - name: Upload package and checks
        uses: actions/upload-artifact@v4
        with:
          name: hiTouyingBeamer-release
          include-hidden-files: true
          path: |
            dist/hiTouyingBeamer-release.zip
            .work/release-validation.json
