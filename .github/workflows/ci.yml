name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-dev.txt

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r scripts/requirements-dev.txt

      - name: Install TeX Live and Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils latexmk texlive-xetex texlive-lang-chinese texlive-science texlive-latex-extra

      - name: Run complete test suite
        run: |
          python scripts/test-suite.py

      - name: Verify release package
        run: python scripts/package.py

      - name: Upload package and checks
        uses: actions/upload-artifact@v4
        with:
          name: hiTouyingBeamer-release
          path: |
            dist/hiTouyingBeamer-release.zip
            .work/release-validation.json
